function skillCell(raw) {
  if (!raw || raw === '–') return '<span class="nd">–</span>';
  return raw.split('/').map(n => {
    const v = parseInt(n);
    let cls = 'sk';
    if (v >= 10) cls += ' sk-red';
    else if (v >= 8) cls += ' sk-green';
    return `<span class="${cls}">${n}</span>`;
  }).join('<span class="sk-sep">/</span>');
}

let sortDir = {};
let currentData = [...chars];

function pct(v){ return (!v||v==='–') ? -1 : parseFloat(v); }

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  const eb = e => { const c=e&&e!=='–'?e:'na'; return `<span class="element-badge ${c}">${e&&e!=='–'?e:'–'}</span>`; };
  const cn = c => { const cl=c===6?'c6':c===5?'c5':''; return `<span class="const-badge ${cl}">C${c}</span>`; };
  const sv  = v => v!=null ? `<span class="sv">${typeof v==='number'?v.toLocaleString('de'):v}</span>` : `<span class="nd">–</span>`;
  const slp = v => v!=null ? `<span class="svlp">${v.toLocaleString('de')}</span>` : `<span class="nd">–</span>`;
  const sem = v => (v!=null&&v!==0) ? `<span class="svem">${v}</span>` : `<span class="nd">0</span>`;
  const sp  = v => v&&v!=='–' ? `<span class="sv">${v}</span>` : `<span class="nd">–</span>`;
  tbody.innerHTML = data.map(c => {
    const isSig = c[13];
    return `<tr class="${isSig?'sig-row':''}">
      <td class="char-name">${c[0]}</td>
      <td>${eb(c[1])}</td>
      <td>${cn(c[2])}</td>
      <td class="level">Lv.${c[3]}</td>
      <td>${slp(c[4])}</td>
      <td>${sv(c[5])}</td>
      <td>${sv(c[6])}</td>
      <td>${sem(c[7])}</td>
      <td>${sp(c[8])}</td>
      <td>${sp(c[9])}</td>
      <td>${sp(c[10])}</td>
      <td style="font-size:0.75rem;color:#ffb8a0">${c[11]&&c[11]!=='–'?c[11]:'<span class="nd">–</span>'}</td>
      <td style="white-space:nowrap">${skillCell(c[15])}</td>
      <td class="${isSig?'weapon-sig':'weapon-normal'}">${c[12]&&c[12]!=='–'?c[12]+(isSig?' ⭐':''):'<span class="nd">–</span>'}</td>
      <td class="set-name">${c[14]&&c[14]!=='–'?c[14]:'<span class="nd">–</span>'}</td>
    </tr>`;
  }).join('');
  document.getElementById('countInfo').textContent = `${data.length} von ${chars.length} Charakteren`;
}

function ft() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const ef  = document.getElementById('elemFilter').value;
  const cf  = document.getElementById('constFilter').value;
  const lf  = document.getElementById('levelFilter').value;
  const sig = document.getElementById('sigFilter').checked;
  currentData = chars.filter(c => {
    if (!c[0].toLowerCase().includes(q)) return false;
    if (ef && c[1] !== ef) return false;
    if (cf && 'C'+c[2] !== cf) return false;
    if (sig && !c[13]) return false;
    if (lf) {
      const [lo, hi] = lf.split('-').map(Number);
      const lv = c[3] || 0;
      if (lv < lo || lv > hi) return false;
    }
    return true;
  });
  renderTable(currentData);
}

function s(col) {
  sortDir[col] = !sortDir[col];
  const d = sortDir[col] ? 1 : -1;
  currentData.sort((a,b) => {
    let va=a[col], vb=b[col];
    if(col===8||col===9||col===10){va=pct(va);vb=pct(vb);}
    if(va==null)va=-Infinity; if(vb==null)vb=-Infinity;
    if(typeof va==='number'&&typeof vb==='number')return d*(va-vb);
    return d*String(va).localeCompare(String(vb));
  });
  renderTable(currentData);
}

ft();
